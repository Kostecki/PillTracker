services:
  pill-tracker:
    image: ghcr.io/kostecki/pill-tracker:latest
    restart: unless-stopped
    container_name: pill-tracker
    hostname: pill-tracker-docker-tower
    ports:
      - 3009:3000
    environment:
      API_TOKEN: ${API_TOKEN}
      TZ: ${TZ}
    volumes:
      - ${DATA_DIR:-.}/data:/data
    labels:
      - "nautical-backup.group=pill-tracker"
