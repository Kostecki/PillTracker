services:
  pill-tracker:
    image: ghcr.io/kostecki/pill-tracker:latest
    restart: unless-stopped
    container_name: pill-tracker
    ports:
      - ${APP_PORT:-8080}:3000
    environment:
      # Bearer token for /api (Home Assistant and the NFC shortcut)
      API_TOKEN: ${API_TOKEN}
      TZ: ${TZ:-Europe/Copenhagen}
    volumes:
      - pill-tracker-data:/data
    labels:
      - "nautical-backup.group=pill-tracker"

volumes:
  pill-tracker-data:
